<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход - Food Construct</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Стили -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Иконки Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />

    <style>
        .login-body {
            margin: 0;
            padding: 0;
            background: url('images/9d6996a3b95db89226e4517040477c74.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
        }
        
        .login-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin-top: 60px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #565fd3;
            margin-bottom: 10px;
            font-family: 'Roboto', sans-serif;
        }
        
        .login-header h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #e63946;
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(230, 57, 70, 0.25);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .login-btn {
            width: 100%;
            background-color: #000000;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .login-btn:hover {
            background-color: #d32f2f;
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }
        
        .back-link:hover {
            color: #e63946;
        }
        
        .error-message {
            color: #e63946;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }
        
        /* Стили для заголовка */
        .page-header {
            margin-bottom: 30px;
            text-align: center;
        }
    </style>
</head>
<body class="login-body">
    <!-- Шапка сайта -->
    <header class="header">
        <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <h1 class="mb-0">Food Construct</h1>
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="assemble-lunch.html">Собрать ланч</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="make-order.html">Оформить заказ</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="orders.html">Мои заказы</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="login.html">Вход</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Основное содержимое -->
    <main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="login-container">
            <div class="login-header">
                <h1>Food Construct</h1>
                <h2>Вход в систему</h2>
            </div>
            
            <form id="login-form" method="POST">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username" required class="form-control">
                    <div class="error-message" id="username-error">Пожалуйста, введите логин</div>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required class="form-control">
                    <div class="error-message" id="password-error">Пожалуйста, введите пароль</div>
                </div>
                
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember" name="remember" class="form-check-input">
                        <label for="remember" class="form-check-label">Запомнить меня</label>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">Войти</button>
                
                <div class="text-center mt-3">
                    <a href="index.html" class="back-link">← Вернуться на главную</a>
                    <p class="mt-2 small">Нет аккаунта? <a href="#" id="register-link">Зарегистрироваться</a></p>
                </div>
            </form>
        </div>
    </main>

    

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Наши скрипты -->
    <script src="js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('username-error');
            const passwordError = document.getElementById('password-error');
            const registerLink = document.getElementById('register-link');

            // Обработчик отправки формы
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                let isValid = true;
                
                // Валидация логина
                if (!usernameInput.value.trim()) {
                    usernameError.style.display = 'block';
                    isValid = false;
                } else {
                    usernameError.style.display = 'none';
                }
                
                // Валидация пароля
                if (!passwordInput.value.trim()) {
                    passwordError.style.display = 'block';
                    isValid = false;
                } else {
                    passwordError.style.display = 'none';
                }
                
                if (isValid) {
                    // Показываем уведомление о загрузке
                    if (typeof showNotification === 'function') {
                        showNotification('Выполняется вход...', 'info');
                    }
                    
                    // Отправка данных на сервер (тестовый)
                    const formData = new FormData(loginForm);
                    
                    fetch('https://httpbin.org/post', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        // Сохраняем информацию о пользователе в localStorage
                        localStorage.setItem('foodconstruct_user_logged_in', 'true');
                        localStorage.setItem('foodconstruct_username', usernameInput.value);
                        
                        // Сохраняем настройку "запомнить меня"
                        const rememberCheckbox = document.getElementById('remember');
                        if (rememberCheckbox.checked) {
                            localStorage.setItem('foodconstruct_remember', 'true');
                        }
                        
                        // Показываем уведомление об успехе
                        if (typeof showNotification === 'function') {
                            showNotification('Вход выполнен успешно!', 'success');
                        }
                        
                        // Перенаправляем на главную страницу через 2 секунды
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 2000);
                    })
                    .catch(error => {
                        console.error('Ошибка:', error);
                        if (typeof showNotification === 'function') {
                            showNotification('Ошибка при входе. Проверьте данные.', 'error');
                        }
                    });
                }
            });
            
            // Обработчик для ссылки регистрации
            if (registerLink) {
                registerLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (typeof showNotification === 'function') {
                        showNotification('Регистрация временно недоступна', 'info');
                    }
                });
            }
            
            // Проверяем, есть ли сохраненные данные для автозаполнения
            if (localStorage.getItem('foodconstruct_remember') === 'true') {
                const savedUsername = localStorage.getItem('foodconstruct_username');
                if (savedUsername) {
                    usernameInput.value = savedUsername;
                    document.getElementById('remember').checked = true;
                }
            }
            
            // Проверяем, авторизован ли пользователь
            if (localStorage.getItem('foodconstruct_user_logged_in') === 'true') {
                // Если пользователь уже авторизован, предлагаем выйти
                const loggedInUser = localStorage.getItem('foodconstruct_username');
                const loginBtn = loginForm.querySelector('.login-btn');
                if (loginBtn) {
                    loginBtn.textContent = `Вы вошли как ${loggedInUser}`;
                    loginBtn.disabled = true;
                    loginBtn.style.backgroundColor = '#28a745';
                    
                    // Добавляем кнопку выхода
                    const logoutBtn = document.createElement('button');
                    logoutBtn.type = 'button';
                    logoutBtn.className = 'btn btn-outline-danger w-100 mt-3';
                    logoutBtn.textContent = 'Выйти';
                    logoutBtn.addEventListener('click', function() {
                        localStorage.removeItem('foodconstruct_user_logged_in');
                        localStorage.removeItem('foodconstruct_username');
                        window.location.reload();
                    });
                    
                    loginForm.appendChild(logoutBtn);
                }
            }
        });
    </script>
</body>
</html>
